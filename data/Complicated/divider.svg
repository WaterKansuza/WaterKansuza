<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20" viewBox="0 0 1000 20">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="0" y="9" width="1000" height="2" fill="url(#l)"/>
  <circle cy="10" r="5" fill="#58A6FF" filter="url(#g)">
    <animate attributeName="cx" values="120;880;120" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="10" r="2" fill="#FFFFFF">
    <animate attributeName="cx" values="120;880;120" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>