<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0B2545"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="240" rx="14"/></clipPath>
  </defs>

  <style>
    .star { fill: #9CCBFF; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    .name { font: 700 56px 'Segoe UI', Helvetica, Arial, sans-serif; animation: rise 1.4s ease-out both; }
    .sub  { font: 400 18px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 4px; fill: #C9D1D9; animation: rise 1.4s .5s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="240" fill="url(#bg)"/>

    <!-- Quầng sáng trôi -->
    <circle cx="820" cy="60" r="110" fill="url(#orb)">
      <animate attributeName="cx" values="780;870;780" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;90;60" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="150" r="90" fill="url(#orb)">
      <animate attributeName="cx" values="170;110;170" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Sao nhấp nháy -->
    <circle class="star" cx="80"  cy="40"  r="1.5" style="animation-delay:.2s"/>
    <circle class="star" cx="190" cy="85"  r="1"   style="animation-delay:1.1s"/>
    <circle class="star" cx="300" cy="30"  r="1.8" style="animation-delay:.7s"/>
    <circle class="star" cx="420" cy="70"  r="1.2" style="animation-delay:1.8s"/>
    <circle class="star" cx="560" cy="35"  r="1.5" style="animation-delay:.4s"/>
    <circle class="star" cx="660" cy="90"  r="1"   style="animation-delay:2.2s"/>
    <circle class="star" cx="760" cy="28"  r="1.8" style="animation-delay:1.4s"/>
    <circle class="star" cx="860" cy="75"  r="1.2" style="animation-delay:.9s"/>
    <circle class="star" cx="940" cy="45"  r="1.5" style="animation-delay:2.6s"/>
    <circle class="star" cx="120" cy="120" r="1"   style="animation-delay:1.6s"/>
    <circle class="star" cx="900" cy="130" r="1.2" style="animation-delay:.1s"/>
    <circle class="star" cx="500" cy="18"  r="1"   style="animation-delay:2s"/>

    <!-- Chữ -->
    <text class="name" x="500" y="108" text-anchor="middle" fill="url(#name)" filter="url(#glow)">Doan Quang</text>
    <text class="sub"  x="500" y="148" text-anchor="middle">BACKEND &#183; CLOUD &#183; ALGORITHMS</text>

    <!-- 3 lớp sóng -->
    <path fill="#58A6FF" opacity="0.25"
          d="M0 190 Q125 168 250 190 T500 190 T750 190 T1000 190 T1250 190 T1500 190 T1750 190 T2000 190 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#1F6FEB" opacity="0.35"
          d="M0 205 Q125 189 250 205 T500 205 T750 205 T1000 205 T1250 205 T1500 205 T1750 205 T2000 205 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="13s" repeatCount="indefinite"/>
    </path>
    <path fill="#0D1117" opacity="0.9"
          d="M0 224 Q125 214 250 224 T500 224 T750 224 T1000 224 T1250 224 T1500 224 T1750 224 T2000 224 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>